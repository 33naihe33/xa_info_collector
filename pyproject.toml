[project]
name = "xa-info-collector"
version = "0.1.0"
description = "雄安信息商机挖掘系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "zhipuai>=2.1.0",
    "sniffio>=1.3.0",
    "apscheduler>=3.10.0",
    "pywebpush>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

# R-07：明确构建后端（否则 pip wheel 回退到脆弱的 legacy 默认）
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["storage*", "collector*", "analyzer*", "reporter*", "notifier*", "web*", "config*"]

[tool.setuptools.package-data]
config = ["*.yaml", "prompts/*.txt"]
# R-07：前端构建产物随 wheel 分发
web = ["frontend/dist/**/*", "frontend/dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
